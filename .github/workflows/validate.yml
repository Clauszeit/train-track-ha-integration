name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS integration repository
        uses: hacs/action@22.5.0
        with:
          category: integration

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate integration
        # Home Assistant documents hassfest on @master; its action has no versioned releases.
        uses: home-assistant/actions/hassfest@master

  sonar:
    name: SonarQube Quality Gate
    needs: [hacs, hassfest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report HACS and Home Assistant validation results
        shell: bash
        env:
          HACS_RESULT: ${{ needs.hacs.result }}
          HASSFEST_RESULT: ${{ needs.hassfest.result }}
        run: |
          echo "HACS validation result: $HACS_RESULT"
          echo "Home Assistant hassfest result: $HASSFEST_RESULT"
      - name: Skip Sonar analysis on pull requests
        if: github.event_name == 'pull_request'
        run: echo "SonarQube analysis is skipped for pull requests; HACS and hassfest results remain required by this gate."
      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SonarQube secrets
        if: github.event_name != 'pull_request'
        id: sonar-secrets
        shell: bash
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_HOST_URL" || -z "$SONAR_TOKEN" ]]; then
            echo "::error::Configure SONAR_HOST_URL and SONAR_TOKEN as repository secrets."
            exit 1
          fi
      - name: Read project version
        if: github.event_name != 'pull_request'
        id: project-version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Analyze with SonarQube Community
        if: github.event_name != 'pull_request'
        id: sonar-scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.project-version.outputs.value }}
            -Dsonar.qualitygate.wait=true
      - name: Enforce combined SonarQube quality gate
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HACS_RESULT: ${{ needs.hacs.result }}
          HASSFEST_RESULT: ${{ needs.hassfest.result }}
          SONAR_SECRETS_OUTCOME: ${{ steps.sonar-secrets.outcome }}
          SONAR_SCAN_OUTCOME: ${{ steps.sonar-scan.outcome }}
        run: |
          failed=false

          if [[ "$HACS_RESULT" != "success" ]]; then
            echo "::error title=HACS validation failed::The HACS validation job finished with '$HACS_RESULT'. Review its job log."
            failed=true
          fi

          if [[ "$HASSFEST_RESULT" != "success" ]]; then
            echo "::error title=Home Assistant validation failed::The hassfest job finished with '$HASSFEST_RESULT'. Review its job log."
            failed=true
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            if [[ "$SONAR_SECRETS_OUTCOME" != "success" ]]; then
              echo "::error title=SonarQube secrets validation failed::The secrets check finished with '$SONAR_SECRETS_OUTCOME'. Configure SONAR_HOST_URL and SONAR_TOKEN as repository secrets."
              failed=true
            fi
            if [[ "$SONAR_SCAN_OUTCOME" != "success" ]]; then
              echo "::error title=SonarQube quality gate failed::The scan finished with '$SONAR_SCAN_OUTCOME'. Review the SonarQube scanner output."
              failed=true
            fi
          fi

          [[ "$failed" == "false" ]]
